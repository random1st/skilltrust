name: SkillTrust
description: >-
  Verify that a Claude Code marketplace's signed index still names the exact bytes in the
  repository, or sign it.

# Verifying is the default and needs no secret. Signing is opt-in and needs a key, which in
# CI means the key lives in a secret — and a secret is reachable by anything that can change
# a workflow file. Read `signing-key` below before turning it on.
inputs:
  command:
    description: "verify (default), sign, or notarize an already-signed index"
    required: false
    default: verify
  repository:
    description: "Path to the marketplace checkout"
    required: false
    default: "."
  public-key:
    description: >-
      PEM public key the index must be signed by. Required for verify. Commit it in the
      repository: the check is only as good as the key it checks against, and a key supplied
      by the same person who can change the workflow checks nothing.
    required: false
    default: catalog.pub
  signing-key:
    description: >-
      PEM private key, for command=sign. Putting a signing key in CI means whoever can change
      a workflow can publish a signed marketplace, so pair it with a threshold of signatures
      that CI alone cannot reach.
    required: false
  marketplace-name:
    description: "Name recorded in the index, when signing"
    required: false
  valid-for:
    description: "How long consumers may use the signature before refreshing"
    required: false
    default: 168h
  notary-url:
    description: >-
      Full catalog endpoint on a SkillTrust notary, e.g.
      https://notary.example.com/v1/catalogs/acme/plugins. With command=sign the freshly
      signed index is submitted there and the countersigned envelope replaces
      catalog.dsse.json in the checkout, so a workflow that commits it keeps the git path
      and the notary path carrying the same bytes. With command=notarize an
      already-committed index is submitted as-is.
    required: false
  notary-token:
    description: >-
      The organisation's publish token for the notary. A secret — but a deliberately
      narrow one: it authorizes submitting catalogs for countersigning, and the notary
      refuses anything not signed by the publisher keys it pinned, so a leaked token
      alone publishes nothing. Leave it empty to authenticate with the job's OIDC token
      instead — no stored secret at all — which needs `permissions: id-token: write` in
      the workflow and the repository registered with the notary.
    required: false
  notary-audience:
    description: "Audience the OIDC token is minted for; must match the notary's configuration"
    required: false
    default: skilltrust-notary

outputs:
  plugin-count:
    description: "How many plugins the index covers"
    value: ${{ steps.run.outputs.plugin-count }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    # Built from the action's own checkout rather than downloaded. A release asset would be
    # faster, but it would also mean the check that guards a repository is fetched over the
    # network at the moment it runs, from somewhere the repository does not control.
    - name: Build skillctl
      shell: bash
      run: |
        cd "${{ github.action_path }}/client"
        go build -trimpath -o "${RUNNER_TEMP}/skillctl" ./cmd/skillctl

    - name: Run
      id: run
      shell: bash
      env:
        SKILLTRUST_COMMAND: ${{ inputs.command }}
        SKILLTRUST_REPO: ${{ inputs.repository }}
        SKILLTRUST_PUBLIC_KEY: ${{ inputs.public-key }}
        SKILLTRUST_SIGNING_KEY: ${{ inputs.signing-key }}
        SKILLTRUST_NAME: ${{ inputs.marketplace-name }}
        SKILLTRUST_VALID_FOR: ${{ inputs.valid-for }}
        SKILLTRUST_NOTARY_URL: ${{ inputs.notary-url }}
        SKILLTRUST_NOTARY_TOKEN: ${{ inputs.notary-token }}
        SKILLTRUST_NOTARY_AUDIENCE: ${{ inputs.notary-audience }}
      run: |
        set -euo pipefail

        # Submit catalog.dsse.json for countersigning and replace it with the notary's
        # answer. The response is written only on HTTP 200: a 409 is a rollback the
        # notary refused, a 422 is a catalog it could not verify, and both must fail the
        # job rather than leave a half-published state.
        notarize() {
          # No stored token: authenticate as this workflow, with the OIDC token GitHub
          # mints for the job. Requires `permissions: id-token: write`; without it the
          # request URL is absent and the error below says what to add.
          if [ -z "${SKILLTRUST_NOTARY_TOKEN}" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "::error::no notary-token, and the job cannot mint an OIDC token; add 'permissions: id-token: write' or set notary-token" >&2
              exit 1
            fi
            SKILLTRUST_NOTARY_TOKEN=$(curl -sS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SKILLTRUST_NOTARY_AUDIENCE}" | jq -r '.value')
            if [ -z "${SKILLTRUST_NOTARY_TOKEN}" ] || [ "${SKILLTRUST_NOTARY_TOKEN}" = "null" ]; then
              echo "::error::minting the OIDC token failed" >&2
              exit 1
            fi
          fi
          index="${SKILLTRUST_REPO}/catalog.dsse.json"
          status=$(curl -sS -o "${RUNNER_TEMP}/notary-response" -w '%{http_code}' \
            -X PUT -H "Authorization: Bearer ${SKILLTRUST_NOTARY_TOKEN}" \
            --data-binary @"${index}" "${SKILLTRUST_NOTARY_URL}")
          if [ "${status}" != "200" ]; then
            echo "::error::the notary answered ${status}: $(cat "${RUNNER_TEMP}/notary-response")" >&2
            exit 1
          fi
          mv "${RUNNER_TEMP}/notary-response" "${index}"
          echo "notarized: ${SKILLTRUST_NOTARY_URL}"
        }

        case "${SKILLTRUST_COMMAND}" in
          verify)
            # The publisher gate: does the signature still describe this repository. The
            # consumer check compares against an installed plugin cache, which a runner does
            # not have — running it here would pass by describing nothing.
            "${RUNNER_TEMP}/skillctl" catalog verify "${SKILLTRUST_REPO}" \
              --key "${SKILLTRUST_PUBLIC_KEY}" | tee "${RUNNER_TEMP}/out"
            ;;
          sign)
            if [ -z "${SKILLTRUST_SIGNING_KEY}" ]; then
              echo "::error::command=sign needs signing-key" >&2
              exit 1
            fi
            # The key is written with no group or world access and removed on exit, including
            # on failure: a signing key left in a runner's temp directory outlives the job on
            # a self-hosted runner.
            key="${RUNNER_TEMP}/signing.key"
            trap 'rm -f "${key}"' EXIT
            umask 077
            printf '%s' "${SKILLTRUST_SIGNING_KEY}" > "${key}"
            args=(marketplace sign "${SKILLTRUST_REPO}" --key "${key}" --valid-for "${SKILLTRUST_VALID_FOR}")
            "${RUNNER_TEMP}/skillctl" "${args[@]}" | tee "${RUNNER_TEMP}/out"
            if [ -n "${SKILLTRUST_NOTARY_URL}" ]; then
              notarize
            fi
            ;;
          notarize)
            if [ -z "${SKILLTRUST_NOTARY_URL}" ]; then
              echo "::error::command=notarize needs notary-url" >&2
              exit 1
            fi
            notarize
            : > "${RUNNER_TEMP}/out"
            ;;
          *)
            echo "::error::unknown command ${SKILLTRUST_COMMAND}" >&2
            exit 1
            ;;
        esac
        count=$(grep -oE '[0-9]+ (of [0-9]+ plugin|skill)' "${RUNNER_TEMP}/out" | head -1 | cut -d' ' -f1 || true)
        echo "plugin-count=${count:-0}" >> "${GITHUB_OUTPUT}"
