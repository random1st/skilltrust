# Build and test the client on every platform it ships for.
#
# Actions are pinned by commit SHA, not by tag. A tag is mutable and a security tool that
# asks people to pin skills by digest while pulling its own CI by a moving reference is
# not one worth trusting.
# Two things used to hide a whole half of this repository from CI: the path filter was
# client/** on both triggers, and every step ran inside client/, where `./...` means the
# client's packages and nothing else. A change to the notary or the catalog therefore
# merged with no test run at all — which is how a commit to the dashboard view was lost
# between an edit and a release without one red mark. Formatting, vet and tests now run
# from the module root; the steps that build the released binaries still run in client/,
# where the Makefile and goreleaser config live.
name: client-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: client

jobs:
  test:
    # The canonical archive must produce identical digests on every platform. Running the
    # golden-digest test on all three is what turns that from a claim into a check.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        if: runner.os != 'Windows'
        working-directory: .
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: .
        run: go vet ./...

      # From the module root on purpose: ./... inside client/ is the client's packages
      # only, and the notary, the catalog and the report format are what the console and
      # every consumer depend on.
      - name: Test
        working-directory: .
        run: go test -race -cover ./...

  reproducible:
    # The product's central claim is that anyone can rebuild a released binary and compare
    # digests. If that ever stops holding, it has to fail here rather than in someone's
    # incident review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Two independent builds must be byte-identical
        run: make reproducible

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Every release target still compiles
        run: |
          for pair in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}" GOARCH="${pair#*/}" go build ./... || exit 1
            echo "  ${pair} ok"
          done
      - name: The plugin does not ship a skillctl that shadows PATH
        # POSIX Makefile. The neighbouring formatting step already skips Windows; this
        # check is about files in git, not about running a Windows binary.
        if: runner.os != 'Windows'
        run: make plugin