# Cut a release of the client.
#
# Everything published here is checksummed, SBOM'd and signed with the same kind of
# machinery SkillTrust sells. Asking people to verify their skills while shipping our own
# binary unsigned would be the clearest possible argument against us.
name: release

on:
  push:
    # A plain semver tag. GoReleaser's monorepo tag prefixes are a Pro feature, and the
    # client is the only released artifact, so there is nothing to disambiguate yet.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest # macOS runner: notarization needs Apple tooling
    permissions:
      contents: write # create the release and upload artifacts
      id-token: write # keyless cosign signing via the OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the changelog from history

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft for SBOM generation
        run: brew install syft

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
          workdir: client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarization are gated on the certificate being present, so a fork
          # can cut an unsigned test release without editing the configuration.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          # Separate token: the Homebrew tap lives in another repository, and GITHUB_TOKEN
          # is scoped to this one.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
