# Cut a release of the client.
#
# This workflow publishes artifacts, checksums, an SBOM and a keyless cosign signature. It
# does NOT hold the Apple Developer ID key.
#
# GoReleaser's notarize block wants that certificate as a base64 secret, which would put
# the key that signs every release wherever the runner lives. For a product whose pitch is
# supply-chain integrity that is the weakest possible link, and it replaces a credential
# boundary that already exists with a new and worse one. macOS releases are therefore
# signed and notarized from the maintainer's machine: `make release && make notarize` in
# client/, with the key never leaving its keychain.
#
# Runs here produce unsigned macOS binaries, and that is the honest outcome: a build nobody
# can Gatekeeper-approve says what it is, while a build signed by a key sitting in shared
# CI does not.
#
# It is therefore NOT triggered by pushing a tag. It used to be, which meant one tag started
# two releases — this one and the maintainer's local `make release` — racing to publish under
# the same version, with the winner decided by timing and one of them unsigned. Publishing is
# one path now: cut it locally. This remains for deliberately producing an unsigned build,
# which is what dispatching it by hand says you meant.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest # lipo, for the universal binary
    permissions:
      contents: write # create the release and upload artifacts
      id-token: write # keyless cosign signing via the OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the changelog from history

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft for SBOM generation
        run: brew install syft

      # This runner has no Developer ID key; saying so is what the signing hook now
      # requires rather than assuming.
      - name: Unsigned macOS build is intended here
        run: echo "SKILLCTL_ALLOW_UNSIGNED=1" >> "${GITHUB_ENV}"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
          workdir: client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Separate token: the Homebrew tap lives in another repository, and GITHUB_TOKEN
          # is scoped to this one.
