# The signature gate, run by the action this repository ships.
#
# Dogfooding is the point: this repository is itself a Claude Code marketplace, so the same
# action an organisation drops into their marketplace repo guards this one. An action that has
# never run against a real repository is an action that works in the README.
name: skills-check

on:
  pull_request:
    paths: ["plugin/**", ".claude-plugin/**", "catalog.dsse.json", "action.yml", ".github/workflows/skills-check.yml"]
  push:
    branches: [main]
    paths: ["plugin/**", ".claude-plugin/**", "catalog.dsse.json", "action.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `uses: ./` runs the action from this checkout, so a change to the action is tested by
      # the same pull request that makes it rather than after it is tagged.
      - name: The signature still describes this repository
        uses: ./
        with:
          command: verify
          public-key: catalog.pub
