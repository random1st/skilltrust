[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skilltrust"
version = "0.1.0"
description = "Provider-neutral trust, notarization, revocation, and distribution control plane for agent skills"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SkillTrust contributors" }]
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "sigstore>=4.3,<5",
  "sqlalchemy>=2.0,<3",
  "tuf>=7,<8",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
skillctl = "skilltrust.cli:app"
skilltrustd = "skilltrust.api:run"
skilltrust-worker = "skilltrust.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skilltrust"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["skilltrust"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "A", "C4", "DTZ", "PTH", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["skilltrust"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
