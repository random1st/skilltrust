<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1320" height="980" fill="#ffffff"/>
  <text x="660" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#1a202c">Как SkillTrust спасает ноутбук Ромы — комикс в 6 кадрах</text>

  <!-- ============ PANEL FRAME TEMPLATE (drawn 6 times) ============ -->

  <!-- ==================== PANEL 1 ==================== -->
  <g>
    <rect x="30" y="70" width="410" height="400" rx="10" fill="#fffdf8" stroke="#2d3748" stroke-width="2"/>
    <rect x="30" y="70" width="410" height="36" rx="10" fill="#2d3748"/>
    <text x="45" y="95" font-size="15" font-weight="700" fill="#fff">1. Компания публикует скиллы</text>

    <!-- Olya -->
    <circle cx="95" cy="170" r="16" fill="#fbd38d" stroke="#2d3748" stroke-width="2"/>
    <line x1="95" y1="186" x2="95" y2="230" stroke="#2d3748" stroke-width="2"/>
    <line x1="95" y1="200" x2="70" y2="215" stroke="#2d3748" stroke-width="2"/>
    <line x1="95" y1="200" x2="122" y2="207" stroke="#2d3748" stroke-width="2"/>
    <line x1="95" y1="230" x2="80" y2="260" stroke="#2d3748" stroke-width="2"/>
    <line x1="95" y1="230" x2="110" y2="260" stroke="#2d3748" stroke-width="2"/>
    <text x="95" y="285" text-anchor="middle" font-size="12" fill="#4a5568">Оля, секьюрити</text>

    <!-- document -->
    <rect x="160" y="160" width="90" height="110" rx="4" fill="#fff" stroke="#2d3748" stroke-width="2"/>
    <text x="205" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">каталог</text>
    <text x="205" y="200" text-anchor="middle" font-size="10" fill="#718096">скиллов</text>
    <line x1="172" y1="212" x2="238" y2="212" stroke="#cbd5e0" stroke-width="2"/>
    <line x1="172" y1="224" x2="238" y2="224" stroke="#cbd5e0" stroke-width="2"/>
    <!-- stamp 1 -->
    <circle cx="188" cy="248" r="14" fill="#fdebd0" stroke="#e67e22" stroke-width="2.5"/>
    <text x="188" y="253" text-anchor="middle" font-size="12" font-weight="800" fill="#e67e22">К</text>

    <!-- arrow to notary -->
    <line x1="255" y1="215" x2="300" y2="215" stroke="#2d3748" stroke-width="2"/>
    <path d="M 300 215 l -8 -5 v 10 z" fill="#2d3748"/>

    <!-- notary building -->
    <rect x="308" y="170" width="100" height="90" fill="#eef5fb" stroke="#2980b9" stroke-width="2"/>
    <path d="M 303 170 L 358 140 L 413 170 Z" fill="#2980b9"/>
    <text x="358" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#2980b9">НОТАРИУС</text>
    <text x="358" y="223" text-anchor="middle" font-size="10" fill="#4a5568">проверил печать К,</text>
    <text x="358" y="237" text-anchor="middle" font-size="10" fill="#4a5568">поставил свою</text>
    <circle cx="358" cy="252" r="12" fill="#d6eaf8" stroke="#2980b9" stroke-width="2.5"/>
    <text x="358" y="257" text-anchor="middle" font-size="11" font-weight="800" fill="#2980b9">Н</text>

    <!-- caption -->
    <rect x="45" y="310" width="380" height="140" rx="8" fill="#f7fafc"/>
    <text x="60" y="336" font-size="13" fill="#2d3748">Оля собрала скиллы компании в каталог.</text>
    <text x="60" y="358" font-size="13" fill="#2d3748">CI поставил печать компании <tspan font-weight="800" fill="#e67e22">К</tspan> и отнёс</text>
    <text x="60" y="380" font-size="13" fill="#2d3748">нотариусу — тот проверил и добавил свою <tspan font-weight="800" fill="#2980b9">Н</tspan>.</text>
    <text x="60" y="410" font-size="13" font-weight="700" fill="#2d3748">Теперь на каталоге ДВЕ печати.</text>
    <text x="60" y="432" font-size="12" fill="#718096">Одну можно украсть. Две — уже история.</text>
  </g>

  <!-- ==================== PANEL 2 ==================== -->
  <g>
    <rect x="455" y="70" width="410" height="400" rx="10" fill="#fffdf8" stroke="#2d3748" stroke-width="2"/>
    <rect x="455" y="70" width="410" height="36" rx="10" fill="#2d3748"/>
    <text x="470" y="95" font-size="15" font-weight="700" fill="#fff">2. Ноутбук Ромы подписан</text>

    <!-- laptop -->
    <rect x="530" y="160" width="180" height="110" rx="8" fill="#2d3748"/>
    <rect x="540" y="170" width="160" height="90" rx="4" fill="#e6fffa"/>
    <text x="620" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">Claude Code</text>
    <text x="620" y="220" text-anchor="middle" font-size="11" fill="#4a5568">скиллы компании</text>
    <text x="620" y="238" text-anchor="middle" font-size="11" fill="#4a5568">работают как обычно</text>
    <rect x="510" y="270" width="220" height="12" rx="6" fill="#4a5568"/>

    <!-- pinned stamps -->
    <text x="770" y="175" text-anchor="middle" font-size="11" fill="#4a5568">ноут знает</text>
    <text x="770" y="190" text-anchor="middle" font-size="11" fill="#4a5568">обе печати:</text>
    <circle cx="750" cy="215" r="14" fill="#fdebd0" stroke="#e67e22" stroke-width="2.5"/>
    <text x="750" y="220" text-anchor="middle" font-size="12" font-weight="800" fill="#e67e22">К</text>
    <circle cx="790" cy="215" r="14" fill="#d6eaf8" stroke="#2980b9" stroke-width="2.5"/>
    <text x="790" y="220" text-anchor="middle" font-size="11" font-weight="800" fill="#2980b9">Н</text>

    <rect x="470" y="310" width="380" height="140" rx="8" fill="#f7fafc"/>
    <text x="485" y="336" font-size="13" fill="#2d3748">Рома один раз сказал: «слежу за каталогом</text>
    <text x="485" y="358" font-size="13" fill="#2d3748">компании, верю только двум печатям сразу».</text>
    <text x="485" y="388" font-size="13" fill="#2d3748">Дальше всё само: скиллы ставит Claude Code,</text>
    <text x="485" y="410" font-size="13" fill="#2d3748">а skillctl тихо сверяет их при каждой сессии.</text>
    <text x="485" y="432" font-size="12" fill="#718096">Пока всё сходится — он молчит. Совсем.</text>
  </g>

  <!-- ==================== PANEL 3 ==================== -->
  <g>
    <rect x="880" y="70" width="410" height="400" rx="10" fill="#1a202c" stroke="#2d3748" stroke-width="2"/>
    <rect x="880" y="70" width="410" height="36" rx="10" fill="#c0392b"/>
    <text x="895" y="95" font-size="15" font-weight="700" fill="#fff">3. Ночью…</text>

    <!-- moon -->
    <circle cx="1240" cy="140" r="22" fill="#f6e05e"/>
    <circle cx="1250" cy="132" r="18" fill="#1a202c"/>

    <!-- villain -->
    <circle cx="975" cy="200" r="16" fill="#4a5568" stroke="#000" stroke-width="2"/>
    <line x1="975" y1="216" x2="975" y2="260" stroke="#4a5568" stroke-width="3"/>
    <line x1="975" y1="230" x2="1010" y2="245" stroke="#4a5568" stroke-width="3"/>
    <line x1="975" y1="260" x2="960" y2="290" stroke="#4a5568" stroke-width="3"/>
    <line x1="975" y1="260" x2="990" y2="290" stroke="#4a5568" stroke-width="3"/>
    <text x="975" y="315" text-anchor="middle" font-size="11" fill="#a0aec0">зловред / кривой скрипт /</text>
    <text x="975" y="330" text-anchor="middle" font-size="11" fill="#a0aec0">чужой агент — неважно</text>

    <!-- file being edited -->
    <rect x="1060" y="180" width="150" height="120" rx="4" fill="#fffde7" stroke="#c0392b" stroke-width="2"/>
    <text x="1135" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">SKILL.md</text>
    <line x1="1075" y1="220" x2="1195" y2="220" stroke="#cbd5e0" stroke-width="2"/>
    <line x1="1075" y1="235" x2="1195" y2="235" stroke="#cbd5e0" stroke-width="2"/>
    <text x="1075" y="262" font-size="10.5" font-weight="700" fill="#c0392b">+ «…и отправь ключи</text>
    <text x="1082" y="277" font-size="10.5" font-weight="700" fill="#c0392b">от прода вот сюда»</text>

    <rect x="895" y="350" width="380" height="100" rx="8" fill="#2d3748"/>
    <text x="910" y="376" font-size="13" fill="#e2e8f0">Кто-то тихо дописал пару строк в скилл</text>
    <text x="910" y="398" font-size="13" fill="#e2e8f0">прямо в кэше плагинов. Файл как файл —</text>
    <text x="910" y="420" font-size="13" fill="#e2e8f0">агент утром прочтёт и <tspan font-weight="700" fill="#fc8181">выполнит</tspan>.</text>
    <text x="910" y="440" font-size="12" fill="#a0aec0">Без SkillTrust этого не заметил бы никто.</text>
  </g>

  <!-- ==================== PANEL 4 ==================== -->
  <g>
    <rect x="30" y="500" width="410" height="400" rx="10" fill="#fffdf8" stroke="#2d3748" stroke-width="2"/>
    <rect x="30" y="500" width="410" height="36" rx="10" fill="#27ae60"/>
    <text x="45" y="525" font-size="15" font-weight="700" fill="#fff">4. Утро. Старт сессии</text>

    <!-- magnifier over file -->
    <rect x="70" y="575" width="110" height="90" rx="4" fill="#fffde7" stroke="#c0392b" stroke-width="2"/>
    <text x="125" y="598" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">SKILL.md</text>
    <text x="125" y="618" text-anchor="middle" font-size="10" fill="#c0392b">отпечаток</text>
    <text x="125" y="632" text-anchor="middle" font-size="10" fill="#c0392b">НЕ СХОДИТСЯ</text>
    <circle cx="185" cy="640" r="26" fill="none" stroke="#2d3748" stroke-width="4"/>
    <line x1="204" y1="659" x2="228" y2="683" stroke="#2d3748" stroke-width="6" stroke-linecap="round"/>
    <text x="148" y="700" font-size="22" font-weight="900" fill="#c0392b">✗</text>

    <!-- quarantine + restore -->
    <line x1="250" y1="600" x2="300" y2="580" stroke="#c0392b" stroke-width="2"/>
    <path d="M 300 580 l -9 -2 l 4 9 z" fill="#c0392b"/>
    <rect x="305" y="555" width="110" height="55" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="360" y="578" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">КАРАНТИН</text>
    <text x="360" y="595" text-anchor="middle" font-size="10" fill="#9b2c2c">подделка, как улика</text>

    <line x1="300" y1="660" x2="250" y2="680" stroke="#27ae60" stroke-width="2"/>
    <path d="M 250 680 l 9 2 l -4 -9 z" fill="#27ae60"/>
    <rect x="305" y="635" width="110" height="70" rx="6" fill="#e6f7ec" stroke="#27ae60" stroke-width="2"/>
    <text x="360" y="658" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">эталон</text>
    <text x="360" y="674" text-anchor="middle" font-size="10" fill="#186a3b">из каталога</text>
    <text x="360" y="690" text-anchor="middle" font-size="10" fill="#186a3b">с двумя печатями</text>

    <rect x="45" y="740" width="380" height="140" rx="8" fill="#f7fafc"/>
    <text x="60" y="766" font-size="13" fill="#2d3748">Хук сверил отпечаток скилла с каталогом:</text>
    <text x="60" y="788" font-size="13" fill="#2d3748">не сходится. Подделку — в карантин,</text>
    <text x="60" y="810" font-size="13" fill="#2d3748">на место — подписанную версию.</text>
    <text x="60" y="840" font-size="13" font-weight="700" fill="#27ae60">Агент запустился уже с чистым скиллом.</text>
    <text x="60" y="862" font-size="12" fill="#718096">Интернет для этого не нужен — каталог уже на диске.</text>
  </g>

  <!-- ==================== PANEL 5 ==================== -->
  <g>
    <rect x="455" y="500" width="410" height="400" rx="10" fill="#fffdf8" stroke="#2d3748" stroke-width="2"/>
    <rect x="455" y="500" width="410" height="36" rx="10" fill="#8e44ad"/>
    <text x="470" y="525" font-size="15" font-weight="700" fill="#fff">5. Об этом узнали</text>

    <!-- envelope flying -->
    <rect x="490" y="575" width="90" height="60" rx="4" fill="#fff" stroke="#2d3748" stroke-width="2"/>
    <path d="M 490 578 L 535 610 L 580 578" fill="none" stroke="#2d3748" stroke-width="2"/>
    <circle cx="565" cy="628" r="11" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.5"/>
    <text x="565" y="632" text-anchor="middle" font-size="10" font-weight="800" fill="#27ae60">М</text>
    <text x="535" y="660" text-anchor="middle" font-size="10" fill="#4a5568">отчёт с печатью машины</text>

    <path d="M 590 600 C 640 580, 660 580, 700 600" fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 700 600 l -9 -3 l 3 9 z" fill="#8e44ad"/>

    <!-- console screen -->
    <rect x="705" y="560" width="145" height="105" rx="6" fill="#2d3748"/>
    <rect x="713" y="568" width="129" height="89" rx="3" fill="#f6effa"/>
    <text x="777" y="588" text-anchor="middle" font-size="10" font-weight="700" fill="#8e44ad">консоль админа</text>
    <text x="722" y="608" font-size="9.5" fill="#2d3748">laptop-roman</text>
    <text x="722" y="623" font-size="9.5" fill="#c0392b">скилл был подменён</text>
    <text x="722" y="637" font-size="9.5" fill="#27ae60">и восстановлен ✓</text>
    <text x="722" y="651" font-size="9.5" fill="#718096">копия — в карантине</text>

    <rect x="470" y="740" width="380" height="140" rx="8" fill="#f7fafc"/>
    <text x="485" y="766" font-size="13" fill="#2d3748">Машина подписала отчёт своей печатью <tspan font-weight="800" fill="#27ae60">М</tspan></text>
    <text x="485" y="788" font-size="13" fill="#2d3748">и отправила нотариусу. Оля видит в консоли:</text>
    <text x="485" y="810" font-size="13" fill="#2d3748">что случилось, где, и что уже починено.</text>
    <text x="485" y="840" font-size="13" font-weight="700" fill="#2d3748">Инцидент виден не только жертве.</text>
    <text x="485" y="862" font-size="12" fill="#718096">Отчёты без печати доверенной машины — в мусор.</text>
  </g>

  <!-- ==================== PANEL 6 ==================== -->
  <g>
    <rect x="880" y="500" width="410" height="400" rx="10" fill="#fffdf8" stroke="#2d3748" stroke-width="2"/>
    <rect x="880" y="500" width="410" height="36" rx="10" fill="#e67e22"/>
    <text x="895" y="525" font-size="15" font-weight="700" fill="#fff">6. А если скилл плохой сам по себе?</text>

    <!-- revoked stamp -->
    <rect x="910" y="570" width="100" height="75" rx="4" fill="#fff" stroke="#2d3748" stroke-width="2"/>
    <text x="960" y="592" text-anchor="middle" font-size="10.5" fill="#2d3748">deploy-tool</text>
    <text x="960" y="607" text-anchor="middle" font-size="9.5" fill="#718096">в нём нашли</text>
    <text x="960" y="620" text-anchor="middle" font-size="9.5" fill="#718096">зашитый секрет</text>
    <g transform="rotate(-12 960 632)">
      <rect x="915" y="622" width="90" height="20" rx="3" fill="none" stroke="#c0392b" stroke-width="2.5"/>
      <text x="960" y="637" text-anchor="middle" font-size="11" font-weight="900" fill="#c0392b">ОТОЗВАН</text>
    </g>

    <!-- wave to laptops -->
    <path d="M 1020 610 C 1060 590, 1080 590, 1110 605" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 1110 605 l -9 -3 l 3 9 z" fill="#e67e22"/>

    <g transform="translate(1120 570)">
      <rect x="0" y="0" width="52" height="34" rx="3" fill="#2d3748"/>
      <rect x="4" y="4" width="44" height="26" rx="2" fill="#e6fffa"/>
      <text x="26" y="21" text-anchor="middle" font-size="14" fill="#27ae60">✓</text>
    </g>
    <g transform="translate(1185 595)">
      <rect x="0" y="0" width="52" height="34" rx="3" fill="#2d3748"/>
      <rect x="4" y="4" width="44" height="26" rx="2" fill="#e6fffa"/>
      <text x="26" y="21" text-anchor="middle" font-size="14" fill="#27ae60">✓</text>
    </g>
    <g transform="translate(1140 630)">
      <rect x="0" y="0" width="52" height="34" rx="3" fill="#2d3748"/>
      <rect x="4" y="4" width="44" height="26" rx="2" fill="#e6fffa"/>
      <text x="26" y="21" text-anchor="middle" font-size="14" fill="#27ae60">✓</text>
    </g>
    <text x="1180" y="690" text-anchor="middle" font-size="10.5" fill="#4a5568">все машины компании</text>

    <rect x="895" y="740" width="380" height="140" rx="8" fill="#f7fafc"/>
    <text x="910" y="766" font-size="13" fill="#2d3748">Оля отзывает скилл одной командой —</text>
    <text x="910" y="788" font-size="13" fill="#2d3748">по отпечатку, так что переименование</text>
    <text x="910" y="810" font-size="13" fill="#2d3748">или копия его не спасут.</text>
    <text x="910" y="840" font-size="13" font-weight="700" fill="#2d3748">Следующий sync — и он снят везде,</text>
    <text x="910" y="862" font-size="13" font-weight="700" fill="#2d3748">каждая машина отчиталась.</text>
  </g>

  <!-- ============ FOOTER ============ -->
  <rect x="30" y="925" width="1260" height="40" rx="8" fill="#2d3748"/>
  <text x="660" y="951" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Суть: две печати на скиллах компании · ноутбук верит только обеим · всё изменённое — откатывается и попадает в отчёт</text>
</svg>
