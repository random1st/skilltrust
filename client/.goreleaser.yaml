# Release pipeline for the SkillTrust client.
#
# Two properties matter more than convenience here:
#   * Reproducibility. -trimpath, a pinned toolchain and mod_timestamp mean anyone can
#     rebuild a released binary and get the same bytes. A verifier you cannot rebuild is a
#     verifier you have to trust, which is the thing this product exists to avoid.
#   * Self-application. Releases are checksummed, SBOM'd and signed with the same kind of
#     machinery SkillTrust sells. We do not ask anyone to trust a tool we ship unsigned.
version: 2

project_name: skillctl

before:
  hooks:
    - go mod tidy
    # The module path pattern, not ./...: the module root is the repository root and this
    # runs from client/, where ./... would test the commands and skip internal/.
    - go test github.com/random1st/skilltrust/...

builds:
  - id: skillctl
    main: ./cmd/skillctl
    binary: skillctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    # Pin the embedded timestamp to the commit so two builds of the same source match.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  # The MCP server, shipped because the console tells people to run it.
  #
  # It was missing while two pages said `claude mcp add skilltrust -- skilltrust-mcp`, so
  # the documented first run ended at a command that could not resolve. A release that omits
  # half of what the onboarding names is not a partial release, it is a broken install path —
  # and the half it omitted is the one an agent reaches for.
  #
  # Same flags as skillctl and for the same reason: a verifier you cannot rebuild is a
  # verifier you have to trust.
  - id: skilltrust-mcp
    main: ./cmd/skilltrust-mcp
    binary: skilltrust-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# A single macOS binary that runs on both Intel and Apple Silicon, so the cask does not
# have to pick.
universal_binaries:
  - id: skillctl-macos
    ids:
      - skillctl
    replace: true
    name_template: skillctl
    hooks:
      # Signed with the local keychain identity; see scripts/sign-macos.sh for why the
      # certificate is not exported into CI secrets.
      post:
        - ./scripts/sign-macos.sh "{{ .Path }}"

  # The MCP server gets the same treatment, not because it is symmetrical but because an
  # unsigned Mach-O downloaded from the internet is quarantined by Gatekeeper. Shipping one
  # signed command beside one that refuses to start would be a worse first run than shipping
  # neither, since the failure arrives after the person believes they are set up.
  - id: skilltrust-mcp-macos
    ids:
      - skilltrust-mcp
    replace: true
    name_template: skilltrust-mcp
    hooks:
      post:
        - ./scripts/sign-macos.sh "{{ .Path }}"

archives:
  # One archive carrying both commands, because they are installed together and a person
  # who downloaded only half would meet the same dead end the console used to lead to.
  - id: skillctl
    ids:
      - skillctl
      - skillctl-macos
      - skilltrust-mcp
      - skilltrust-mcp-macos
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
      # macOS ships as a zip because that is what Apple's notary service accepts —
      # notarytool takes .zip, .pkg or .dmg and refuses a tarball. Found by running a real
      # release: everything else passed and the submission was rejected at the last step,
      # which is the only place this could have shown up.
      - goos: darwin
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

# Keyless Sigstore signatures over the checksum file: one signature covers every artifact.
# Requires cosign on the release runner.
# Cosign is deferred with Homebrew, and for a sharper reason.
#
# Keyless signing takes an OIDC identity and writes the signature into Rekor, the public
# transparency log. That is the right trade for a public artifact and the wrong one here: this
# repository is private, and a Rekor entry would publish its existence, the checksum, and the
# signer's identity to an append-only log that cannot be edited afterwards. Deferring costs
# nothing today, because the artifacts are distributed to people who already have access to
# the repository, and their integrity is covered by the checksums and the notarized Developer
# ID signature. It comes back the moment the repository is public.

# Homebrew, restored. It was deferred for a reason that expired.
#
# The note that stood here said a cask can only serve a release the public can download, that
# this repository was private, and that a tap would produce installs failing with a 404. Both
# halves of that are gone: the repository went public on 2026-08-28 under Apache-2.0. Nobody
# revisited the decision, so the console kept telling people to run
# `brew install random1st/tap/skillctl` against a tap that has never contained it — which is
# the same 404 the deferral was avoiding, arrived at from the other direction.
#
# Both commands are installed, because the onboarding names both and a person who followed it
# and got half would meet the dead end one step later.
homebrew_casks:
  - name: skillctl
    repository:
      owner: random1st
      name: homebrew-tap
    homepage: https://github.com/random1st/skilltrust
    description: Verify, restore and revoke the Agent Skills your organisation signed
    # Both, named explicitly. The console tells people to run `skilltrust-mcp`, and a cask
    # that linked only skillctl would put them one step further along before the same dead
    # end.
    binaries:
      - skillctl
      - skilltrust-mcp
    # No quarantine dance. The macOS artifact is signed with a Developer ID and notarized,
    # which is what makes it openable — a cask that stripped the attribute instead would be
    # teaching people to bypass the check this project is in the business of selling.

release:
  draft: true
  prerelease: auto
  footer: |
    ## Verify this release

    ```
    cosign verify-blob \
      --certificate skillctl_{{ .Version }}_checksums.txt.pem \
      --signature   skillctl_{{ .Version }}_checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/random1st/skilltrust/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      skillctl_{{ .Version }}_checksums.txt
    ```

    Builds are reproducible: `-trimpath` with a pinned toolchain and a commit-derived
    timestamp. Rebuild from the tag and compare digests rather than taking our word for it.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
