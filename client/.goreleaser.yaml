# Release pipeline for the SkillTrust client.
#
# Two properties matter more than convenience here:
#   * Reproducibility. -trimpath, a pinned toolchain and mod_timestamp mean anyone can
#     rebuild a released binary and get the same bytes. A verifier you cannot rebuild is a
#     verifier you have to trust, which is the thing this product exists to avoid.
#   * Self-application. Releases are checksummed, SBOM'd and signed with the same kind of
#     machinery SkillTrust sells. We do not ask anyone to trust a tool we ship unsigned.
version: 2

project_name: skillctl

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: skillctl
    main: ./cmd/skillctl
    binary: skillctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    # Pin the embedded timestamp to the commit so two builds of the same source match.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# A single macOS binary that runs on both Intel and Apple Silicon, so the cask does not
# have to pick.
universal_binaries:
  - id: skillctl-macos
    ids:
      - skillctl
    replace: true
    name_template: skillctl
    hooks:
      # Signed with the local keychain identity; see scripts/sign-macos.sh for why the
      # certificate is not exported into CI secrets.
      post:
        - ./scripts/sign-macos.sh "{{ .Path }}"

archives:
  - id: skillctl
    ids:
      - skillctl
      - skillctl-macos
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
      # macOS ships as a zip because that is what Apple's notary service accepts —
      # notarytool takes .zip, .pkg or .dmg and refuses a tarball. Found by running a real
      # release: everything else passed and the submission was rejected at the last step,
      # which is the only place this could have shown up.
      - goos: darwin
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

# Keyless Sigstore signatures over the checksum file: one signature covers every artifact.
# Requires cosign on the release runner.
# Cosign is deferred with Homebrew, and for a sharper reason.
#
# Keyless signing takes an OIDC identity and writes the signature into Rekor, the public
# transparency log. That is the right trade for a public artifact and the wrong one here: this
# repository is private, and a Rekor entry would publish its existence, the checksum, and the
# signer's identity to an append-only log that cannot be edited afterwards. Deferring costs
# nothing today, because the artifacts are distributed to people who already have access to
# the repository, and their integrity is covered by the checksums and the notarized Developer
# ID signature. It comes back the moment the repository is public.

# Homebrew is deferred until the licence is decided.
#
# A cask can only serve a release the public can download, and this repository is private, so
# publishing one would produce a tap whose every install fails with a 404 — worse than no tap,
# because the failure looks like a broken tool rather than a closed door. Releases are GitHub
# assets and `go install`; the cask block is in git history and comes back unchanged when the
# licence question is answered.
release:
  draft: true
  prerelease: auto
  footer: |
    ## Verify this release

    ```
    cosign verify-blob \
      --certificate skillctl_{{ .Version }}_checksums.txt.pem \
      --signature   skillctl_{{ .Version }}_checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/random1st/skilltrust/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      skillctl_{{ .Version }}_checksums.txt
    ```

    Builds are reproducible: `-trimpath` with a pinned toolchain and a commit-derived
    timestamp. Rebuild from the tag and compare digests rather than taking our word for it.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
